# Page bodies come from docs/help/<lang> through the hook below; see its docstring.
site_name: KUMA User Guide
site_url: https://gyuminlee-repo.github.io/kuma/
repo_url: https://github.com/gyuminlee-repo/kuma
repo_name: gyuminlee-repo/kuma
docs_dir: docs/site/en
site_dir: site

hooks:
  - docs/site/help_pages.py

extra:
  help_dir: docs/help/en
  alternate:
    - name: English
      link: /kuma/
      lang: en
    - name: 한국어
      link: /kuma/ko/
      lang: ko

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - content.code.copy

nav:
  - index.md
  - KURO:
    - kuro-index.md
    - kuro-01-load.md
    - kuro-02-mutation.md
    - kuro-03-params.md
    - kuro-04-submit.md
    - kuro-05-output.md
    - kuro-06-export.md
  - MAME:
    - mame-index.md
    - mame-01-setup.md
    - mame-02-review.md
    - mame-03-janus.md
    - mame-04-activity.md
    - mame-pipeline.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
