name: Audit index bootstrap (temporary)

# Exact-preimage test-first repair of this branch's planner; removed before merge.
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/audit-index-bootstrap.yml]
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  verify-index-union:
    if: github.head_ref == 'chore/incremental-audit-20260918' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reproduce the index gap, then fix it and retest
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          script = Path('scripts/plan_incremental_audit.py')
          tests = Path('tests/audit/test_incremental_audit.py')
          for path, sha in [(script, 'a08f1c570ed6409840c9ca6d7bb4632496239fa8'), (tests, '46817ea77a618fbac328eedde5a49f558285d156')]:
              if subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() != sha:
                  raise RuntimeError(f'{path}: preimage changed; reconcile before editing')
          anchor = '    def test_untracked_new_dependency_is_not_invisible(self):\n'
          addition = '''    def test_staged_change_hidden_by_worktree_restore_requires_review(self):
                  original = (self.root / "kuma_core/core.py").read_text(encoding="utf-8")
                  self.write("kuma_core/core.py", "def tested(): return 42\\n")
                  self.git("add", "kuma_core/core.py")
                  self.write("kuma_core/core.py", original)
                  self.assertEqual(self.git("diff", "HEAD", "--", "kuma_core/core.py"), "")
                  self.assertNotEqual(self.git("diff", "--cached", "--", "kuma_core/core.py"), "")
                  self.assertEqual(self.status(), "review_required")
                  self.assertIn("kuma_core/core.py", self.report()["working_tree_changes"])

              def test_staged_deletion_with_restored_worktree_cannot_reuse(self):
                  original = (self.root / "kuma_core/core.py").read_text(encoding="utf-8")
                  self.git("rm", "--cached", "kuma_core/core.py")
                  self.write("kuma_core/core.py", original)
                  self.assertEqual(self.status(), "review_required")

          '''
          # The literal is aligned for the workflow YAML, then dedented for the class.
          import textwrap
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.split('\n'))
          data = tests.read_text(encoding='utf-8')
          if data.count(anchor) != 1:
              raise RuntimeError('Test insertion anchor changed')
          tests.write_text(data.replace(anchor, addition + anchor, 1), encoding='utf-8')
          subprocess.run(['python', '-m', 'py_compile', str(tests)], check=True)
          old = subprocess.run(['python', '-m', 'unittest', 'discover', '-s', 'tests/audit', '-p', 'test_*.py', '-k', 'staged_change_hidden', '-v'])
          if old.returncode != 1:
              raise RuntimeError('The new regression must fail before the fix')
          old_text = '            self.local_changes = self.names("diff", "--name-only", "--no-renames", "-z", "HEAD", "--")\n'
          new_text = '''            # Inspect the index and worktree separately. A staged edit followed
                      # by restoring the worktree to HEAD cancels out in git diff HEAD,
                      # but the staged content could still be committed.
                      self.local_changes = self.names("diff", "--cached", "--name-only", "--no-renames", "-z", "HEAD", "--")
                      self.local_changes |= self.names("diff", "--name-only", "--no-renames", "-z", "--")
          '''
          new_text = '\n'.join(line[10:] if line.startswith('                      ') else line for line in new_text.split('\n'))
          data = script.read_text(encoding='utf-8')
          if data.count(old_text) != 1:
              raise RuntimeError('Planner insertion anchor changed')
          script.write_text(data.replace(old_text, new_text, 1), encoding='utf-8')
          subprocess.run(['python', '-m', 'unittest', 'discover', '-s', 'tests/audit', '-p', 'test_*.py', '-v'], check=True)
          PY
      - name: Publish only the tested planner and its regressions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/plan_incremental_audit.py tests/audit/test_incremental_audit.py
          git diff --cached --check
          git commit -m 'fix(audit): union staged and unstaged changes without cancelling either'
          git push origin HEAD:refs/heads/chore/incremental-audit-20260918
