name: Audit citation bootstrap (temporary)

# Removed before final CI/merge. This only appends four exact, justified entries.
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/audit-citation-bootstrap.yml]
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  register-generated-paths:
    if: github.head_ref == 'chore/incremental-audit-20260918' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Preserve all existing entries and register exact generated/test paths
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          path = Path('scripts/doc-citations-allow.json')
          actual = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          if actual != '108b61d2083ff997518def17df15665f77594815':
              raise RuntimeError('Citation ledger changed; reconcile instead of overwriting')
          data = json.loads(path.read_text(encoding='utf-8'))
          additions = [
              {'path': 'docs/explanation.md', 'category': 'prose', 'reason': 'Created only inside a temporary Git repository by tests/audit/test_incremental_audit.py to verify that an unrelated document does not invalidate a recorded code scope. Not a reference to a project document.'},
              {'path': 'incremental-audit.md', 'category': 'generated', 'reason': 'Markdown review plan generated in the Actions runner temporary directory by scripts/plan_incremental_audit.py and uploaded by the incremental-audit workflow. It is not a checked-in report.'},
              {'path': 'RUNNER_TEMP/incremental-audit.md', 'category': 'generated', 'reason': 'The citation extractor strips the dollar sign from the workflow environment-variable path. This is the same generated per-run review plan in the runner temporary directory, not a missing source document.'},
              {'path': 'tmp/kuma-audit-plan.md', 'category': 'generated', 'reason': 'Example optional output of scripts/plan_incremental_audit.py in docs/audit/incremental-review.md; the command writes this review plan outside the source checkout. It is not an existing audit evidence document.'},
          ]
          existing = {entry['path'] for entry in data['allow']}
          if existing.intersection(entry['path'] for entry in additions):
              raise RuntimeError('Do not duplicate citation entries')
          data['allow'].extend(additions)
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Run the actual citation gate, without weakening it
        run: node scripts/check-doc-citations.mjs
      - name: Publish the bounded ledger update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/doc-citations-allow.json
          git diff --cached --check
          git commit -m 'chore(audit): document generated plan paths and the temporary document fixture'
          git push origin HEAD:refs/heads/chore/incremental-audit-20260918
