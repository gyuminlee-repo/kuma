name: Merizo Windows CPU feasibility
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/merizo-windows-smoke.yml'
      - 'scripts/merizo_windows_smoke/**'
      - 'scripts/domain_runtime_smoke/**'
      - 'scripts/merizo_runtime_archive/**'
      - 'tests/test_merizo_runtime_archive*.py'
      - 'kuma_core/kuro/domain_process.py'
      - 'kuma_core/kuro/domain_lease.py'
      - 'kuma_core/kuro/domain_watchdog.py'
      - 'kuma_core/kuro/optional_runtime.py'
      - 'tests/test_domain_lease.py'
      - 'tests/test_domain_watchdog.py'
      - 'kuma_core/shared/windows_rpc.py'
      - 'kuma_core/shared/sidecar.py'
      - 'tests/test_domain_process.py'
      - 'tests/shared/test_windows_rpc.py'
      - 'tests/test_domain_runtime_smoke.py'
      - 'scripts/collect-python-licenses.py'
      - 'scripts/license-supplements.json'
      - 'tests/test_merizo_legal_inventory.py'
      - 'tests/test_merizo_windows*.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: merizo-windows-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-windows-cpu:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - name: Preserve pinned source and PDB bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Obtain exact official upstream (test only)
        uses: actions/checkout@v5
        with:
          repository: psipred/Merizo
          ref: 41d12fb84e6e8fdb586c2c859d12161dc7bb5bfd
          path: .merizo-smoke-upstream
          persist-credentials: false
      - name: Install CPU compatibility environment (no product bundle)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "torch==2.0.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check -r scripts/merizo_windows_smoke/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate harness without inference
        run: python -m unittest discover -s tests -p "test_merizo_windows*.py" -v
      - name: Validate legal evidence collector
        run: python -m unittest discover -s tests -p 'test_merizo_legal_inventory.py' -v
      - name: Run fixed public fixture with 300 second process limit
        run: python scripts/merizo_windows_smoke/run.py --source .merizo-smoke-upstream --fixture tests/data/domain_annotation/1ubq.pdb --output merizo-smoke-results/windows-cpu.json
      - name: Install fixed freezing tool (CI-only)
        run: python -m pip install --disable-pip-version-check -r scripts/merizo_windows_smoke/freezer-requirements.txt
      - name: Install pinned host process identity dependency (probe only)
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: psutil==7.2.2
      - name: Validate actual frozen IPC and managed process lifecycle
        timeout-minutes: 5
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'domain runtime contract'
          python -m PyInstaller --clean --noconfirm --onedir --name domain-runtime-probe --hidden-import domain_lease --hidden-import domain_watchdog --hidden-import optional_runtime --hidden-import psutil --paths . --paths kuma_core/kuro --distpath "$build/dist" --workpath "$build/work" --specpath "$build/spec" scripts/domain_runtime_smoke/entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/domain_runtime_smoke/run.py --binary "$build/dist/domain-runtime-probe/domain-runtime-probe.exe" --report merizo-smoke-results/domain-contract.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect installed legal texts for separate distribution review
        run: python scripts/merizo_windows_smoke/collect_legal_inventory.py --source .merizo-smoke-upstream --output merizo-smoke-results/legal-inventory.json
      - name: Build temporary onedir executable after verifying official pins
        timeout-minutes: 12
        run: python scripts/merizo_windows_smoke/build_frozen.py --source .merizo-smoke-upstream --output-directory "${{ runner.temp }}/merizo frozen build" --evidence merizo-smoke-results/frozen-build.json
      - name: Prepare candidate archive input evidence (no distribution)
        timeout-minutes: 10
        env:
          KUMA_GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python -m scripts.merizo_runtime_archive.ci --source .merizo-smoke-upstream --evidence-directory merizo-smoke-results --task-directory "${{ runner.temp }}/merizo archive audit"
      - name: Run direct archive build controller and installed CPU entry
        timeout-minutes: 20
        shell: pwsh
        run: |
          $audit = Join-Path $env:RUNNER_TEMP 'merizo archive audit'
          & "$audit/build environment/Scripts/python.exe" -m scripts.merizo_runtime_archive.build --source "$audit/official source" --output-directory "$audit/package build" --evidence merizo-smoke-results/runtime-archive.json --wheelhouse "$audit/wheelhouse" --input-lock merizo-smoke-results/archive-input-lock.json --cpython-origin merizo-smoke-results/archive-cpython-origin.json --fixture tests/data/domain_annotation/1ubq.pdb --remove-source-before-run
          exit $LASTEXITCODE
      - name: Remove original upstream checkout before isolated executable run
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE '.merizo-smoke-upstream'
          if (!(Test-Path $source)) { throw 'Expected task-only upstream checkout is missing' }
          Remove-Item -LiteralPath $source -Recurse -Force
          if (Test-Path $source) { throw 'Task-only source cleanup failed' }
      - name: Run packaged executable without Python on PATH
        timeout-minutes: 7
        shell: pwsh
        run: >-
          ./scripts/merizo_windows_smoke/run_frozen.ps1
          -PackageDirectory "${{ runner.temp }}/merizo frozen build/dist/merizo-frozen-smoke"
          -Fixture tests/data/domain_annotation/1ubq.pdb
          -ResultDirectory merizo-smoke-results
          -PinReport merizo-smoke-results/frozen-build.json
      - name: Remove archive inputs only with controller cleanup proof
        if: always()
        run: python -m scripts.merizo_runtime_archive.ci --cleanup --evidence-directory merizo-smoke-results --task-directory "${{ runner.temp }}/merizo archive audit"
      - name: Preserve small result only (never models or runtime)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merizo-windows-cpu-result
          path: |
            merizo-smoke-results/windows-cpu.json
            merizo-smoke-results/frozen-build.json
            merizo-smoke-results/legal-inventory.json
            merizo-smoke-results/domain-contract.json
            merizo-smoke-results/archive-ci.json
            merizo-smoke-results/archive-cleanup.json
            merizo-smoke-results/archive-input-lock.json
            merizo-smoke-results/archive-cpython-origin.json
            merizo-smoke-results/runtime-archive.json
            merizo-smoke-results/frozen-windows-cpu.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove task-only upstream weights/source
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .merizo-smoke-upstream) { Remove-Item -Recurse -Force .merizo-smoke-upstream }
          $build = Join-Path $env:RUNNER_TEMP 'merizo frozen build'
          if (Test-Path $build) { Remove-Item -LiteralPath $build -Recurse -Force }
          if (Test-Path $build) { throw 'Task-only frozen package cleanup failed' }
          $contract = Join-Path $env:RUNNER_TEMP 'domain runtime contract'
          if (Test-Path $contract) { Remove-Item -LiteralPath $contract -Recurse -Force }
          if (Test-Path $contract) { throw 'Task-only contract package cleanup failed' }
