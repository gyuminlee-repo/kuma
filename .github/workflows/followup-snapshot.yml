name: Follow-up source snapshot (temporary)

# Review-only transport for this branch; removed before merging.
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/followup-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'refactor/verified-contracts-20260918'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bundle tracked repository history
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/review-current.bundle" HEAD
          git rev-parse HEAD
      - uses: actions/upload-artifact@v6
        with:
          name: kuma-followup-source
          path: ${{ runner.temp }}/review-current.bundle
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
