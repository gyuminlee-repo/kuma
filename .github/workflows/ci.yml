name: CI

on:
  pull_request:
    branches: [main]
  # Also on direct pushes to main, not only pull requests. A commit that lands
  # on main without one is otherwise unchecked until the release tag, where the
  # first gate it meets is quality-gates and a failure there skips build and
  # release for the whole run. v0.15.0 was lost that way: it reached main
  # outside a pull request with pyproject.toml left at the previous version,
  # and version-sync only spoke up once the tag was already cut.
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: pip install -e ".[test]"

      - name: Provide minimap2 (Linux)
        if: runner.os == 'Linux'
        run: |
          python python-core/scripts/vendor-minimap2.py
          echo "$GITHUB_WORKSPACE/python-core/vendor/minimap2/linux-x64" >> $GITHUB_PATH

      - name: Provide minimap2 (macOS)
        if: runner.os == 'macOS'
        run: brew install minimap2

      - name: Run Python tests
        # -rs prints a short summary of every skipped test with its reason.
        # 15 tests (tests/integration/test_xlsx_pipeline.py, 9, and
        # tests/mame/test_well_consensus_regression.py::TestReferenceGroundTruth,
        # 6) gate on KUMA_TEST_DATA_DIR / WORKSPACE_ROOT, which no workflow sets,
        # so they have never run here. The data is not in the repository, so the
        # fix is that the log states which tests did not run rather than
        # reporting a green that reads as full coverage.
        run: python -m pytest tests/ -v -rs

  # A Python type gate, deliberately its own job rather than a step inside
  # python-tests: that job is a 3-OS by 2-version matrix, so a step there would
  # run the same analysis six times to learn the same thing once.
  #
  # What this catches that the test suite cannot: a value the code declares can
  # be None reaching a place that assumes it cannot. This repo separates None
  # meaning UNKNOWN from 0.0 meaning A MEASURED VALUE all the way through the
  # consensus metrics, the FASTA header, the sidecar response and the Excel
  # export, and a layer that folds one into the other reports evidence nobody
  # measured. That is a scientific defect the tests pass straight through,
  # because a test only fails on the path it happens to execute.
  #
  # The rule set is [tool.pyright] in pyproject.toml, so an editor and this job
  # read the same configuration.
  python-typecheck:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e ".[test,typecheck]"

      # The checker version is pinned but the analysed dependencies are not, so a
      # dependency upgrade alone can change what this gate reports (a newer pandas
      # once turned three DataFrame cell reads into errors here while a local venv
      # with older pandas stayed clean). CI is the authoritative environment when
      # the two disagree.
      - name: Python typecheck
        run: basedpyright

  frontend-typecheck:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          # 50 to match SEARCH_DEPTH in scripts/check-version-label.mjs, which
          # this job runs through sync:check. Depth 2 was chosen on the premise
          # that a squash commit always carries the version label, so the label
          # would sit at HEAD. It does not: GitHub takes a squash subject from
          # the branch's single commit when there is only one, and v0.16.35
          # reached main unlabelled that way. With two unlabelled commits on
          # top, a depth-2 checkout finds no label at all, the check reports
          # "skipped" and exits 0, and main goes green while the manifests and
          # the newest label still disagree. That happened on f1ab761a.
          fetch-depth: 50

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies (for sidecar models)
        run: pip install -e .

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Check generated TS models are up-to-date
        run: node scripts/gen-models.mjs --check

      - name: Stub generated bundle resource (NOTICE.md) for cross-layer sync
        run: |
          mkdir -p src-tauri/resources
          printf '# Third-party notices\n\n(placeholder; real content generated at build time by scripts/build-notice.mjs)\n' > src-tauri/resources/NOTICE.md

      # Run the wrapper, not the individual stages. sync:check owns the stage list
      # and naming them here goes stale. What's New freshness was once missing, so src/locales/en.json's
      # whatsNewDialog.highlights could drift from the CHANGELOG "### Highlights"
      # block, reach main, and only surface on the release tag, where a failed
      # quality-gates skips build and release entirely. The nine other locales are
      # not covered here: the i18n locale parity step below is what checks them.
      # build.yml already invokes the wrapper; this keeps the two in step.
      - name: Cross-layer sync check
        run: pnpm run sync:check

      - name: i18n hardcoded-Korean lint
        run: node scripts/i18n-lint.mjs

      # Covers all ten locales, not just en/ko: key parity, empty values, the
      # What's New highlightsStamp, and the authoring rules on the translated
      # highlights.
      - name: i18n locale parity and What's New stamp
        run: node scripts/i18n-parity.mjs

      # Frontend unit tests had no job at all, so 900-odd vitest cases were only ever
      # run by hand. A test nobody runs is documentation with a false badge on it, and
      # on this repo it cannot be run from WSL: pnpm install into the shared folder
      # replaces the Windows node_modules and breaks the Windows build.
      - name: Frontend unit tests
        run: npx vitest run

  # benchmark/al/ is research code for a paper, not part of the product. Its 196
  # tests were collected by nothing: testpaths names one directory, and the
  # [tool.pyright] and packages.find includes exclude the tree as well. Not
  # packaged is the right call for research code; not run was never a decision,
  # only a side effect.
  #
  # Non-blocking on purpose. Eight of those tests import
  # kuma_core.kuro.evolvepro directly, so as a required gate this tree could
  # refuse a legitimate product change to four symbols that the product suite
  # already covers (tests/test_benchmark.py, test_kuro_centroid.py,
  # test_pareto_esm.py, test_structural_select.py). The tree has also not been
  # touched since 2026-06-23 while evolvepro.py kept moving, so a red here is
  # more likely to mean the benchmark lagged than that the product broke.
  #
  # One Linux leg rather than the six-way matrix: the point is that the suite
  # runs at all, and the release does not ship this code to any platform. The
  # critical path through this workflow is the Windows python-tests leg at
  # roughly five minutes, so a one-minute job alongside it costs no wall clock.
  benchmark-tests:
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The benchmark extra rather than test: scikit-learn and scipy belong to
      # this tree alone, and the six product legs should not carry them.
      - name: Install Python dependencies
        run: pip install -e ".[benchmark]"

      # -rs so a skip states which resource is absent. Four resources gate
      # tests here (the G002 pilot JSONs, fair-esm, evolvepro, the IspS
      # provenance directory), and none of them can be provisioned in CI, so
      # what this job protects against is a green that reads as full coverage.
      - name: Run benchmark tests
        run: python -m pytest benchmark/al/tests -v -rs

  rust-check:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # This step has hung twice, on 2026-08-19, holding the job over an hour
      # against a 89-second baseline for the whole job while every other check
      # on the same commit went green. Both times a cancel and re-run cleared
      # it, and neither commit touched Rust or apt. If this job alone sits in
      # this step for many minutes, re-run the workflow rather than looking for
      # the cause in the diff.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run build

      - name: Create sidecar + resource stubs for Tauri context
        run: |
          mkdir -p src-tauri/binaries
          printf '#!/usr/bin/env sh\nexit 0\n' > src-tauri/binaries/kuro-sidecar-x86_64-unknown-linux-gnu
          printf '#!/usr/bin/env sh\nexit 0\n' > src-tauri/binaries/mame-sidecar-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/kuro-sidecar-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/mame-sidecar-x86_64-unknown-linux-gnu
          mkdir -p src-tauri/resources
          printf '# Third-party notices\n\n(placeholder; real content generated at build time by scripts/build-notice.mjs)\n' > src-tauri/resources/NOTICE.md

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: src-tauri

      - name: Rust check
        run: cargo check
        working-directory: src-tauri
