name: Audit documentation bootstrap (temporary)

# Temporary exact-preimage editor for this authorized branch only.
# Removed before final CI and merge; it never writes main or releases.
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/audit-doc-bootstrap.yml]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  install-entry-points:
    if: github.head_ref == 'chore/incremental-audit-20260918' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preserve instructions and apply bounded edits
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          def replace_once(path, old, new, expected_blob=None):
              p = Path(path)
              if expected_blob is not None:
                  actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
                  if actual != expected_blob:
                      raise RuntimeError(f'{path}: preimage changed; reconcile instead of overwriting')
              data = p.read_bytes()
              old, new = old.encode('utf-8'), new.encode('utf-8')
              if data.count(old) != 1:
                  raise RuntimeError(f'{path}: expected exactly one anchor')
              p.write_bytes(data.replace(old, new, 1))
          replace_once('AGENTS.md', '# AGENTS.md\n', '''# AGENTS.md

          ## Incremental audit entry point (debugging / refactoring)

          Start repeated code-health work with `python scripts/plan_incremental_audit.py`.
          Read `docs/audit/incremental-review.md` and the generated plan before a fresh
          whole-repository sweep. `docs/audit/registry.json` records bounded prior reviews,
          immutable commits, tests, dependency watches and remaining unverified work.
          Reuse unchanged explanations only after reviewing unrecorded/new changes and
          checking dependency-map completeness. A `reuse_candidate` is NOT a passing
          test or approval. Missing history/evidence requires broader review, not a skip.
          Re-run regressions and the existing full CI on the final head before merge.
          Never automatically advance all baselines, promote skipped real-data tests,
          or remove final gates to save time. State reused/rechecked/unverified scopes
          in the PR summary. The detailed procedure includes safe ledger updates.
          ''', '1b4133dae15c80a42e5c4b7954d9928042f32d88')
          replace_once('AUDIT-STATUS.md', '# What the audit pages are, and what landed from them\n', '''# What the audit pages are, and what landed from them

          ## Incremental review index (2026-09-18)

          For the next debugging/refactoring pass, first run
          `python scripts/plan_incremental_audit.py` and read
          `docs/audit/incremental-review.md`. The machine-readable
          `docs/audit/registry.json` records nine bounded scopes from PR #425
          (`3577ea44`) and #428 (`bad3d1c9`), their original baselines, regression
          tests, historical CI evidence, dependency watches and explicit limits.
          This supplements the historical pages below; it does not relabel every old
          finding as resolved or certify an entire module. Context changes after #425
          can still require re-review. Missing independent data/calibration stays
          unverified. Only manual review effort can be reused; final full CI still runs.

          ''', '622946f5ee553a279bbdef695eab9005a180b5af')
          replace_once('tests/audit/test_incremental_audit.py',
              'Path(__file__).resolve().parents[2] / ".." / "scripts"',
              'Path(__file__).resolve().parents[2] / "scripts"')
          replace_once('scripts/plan_incremental_audit.py',
              'from fnmatch import fnmatchcase\n',
              'from fnmatch import fnmatchcase\nfrom functools import lru_cache\n')
          replace_once('scripts/plan_incremental_audit.py',
              'def expand_pattern(pattern: str) -> list[str]:',
              '@lru_cache(maxsize=8192)\ndef expand_pattern(pattern: str) -> list[str]:')
          replace_once('scripts/plan_incremental_audit.py',
              '    records = []\n    errors = []\n',
              '    records = []\n    errors = []\n    impact_cache: dict[str, tuple[set[str], list[str]]] = {}\n')
          replace_once('scripts/plan_incremental_audit.py',
              '            impacted, group_ids = impact_closure(changes, universe, groups)\n',
              '            if item["reviewed_commit"] not in impact_cache:\n                impact_cache[item["reviewed_commit"]] = impact_closure(changes, universe, groups)\n            impacted, group_ids = impact_cache[item["reviewed_commit"]]\n')
          PY
      - name: Test the actual edits before publishing
        run: python -m unittest discover -s tests/audit -p 'test_*.py' -v
      - name: Publish only the bounded source and documentation edits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md AUDIT-STATUS.md scripts/plan_incremental_audit.py tests/audit/test_incremental_audit.py
          git diff --cached --check
          git commit -m 'chore(audit): wire agent review entry points and validate planner fixtures'
          git push origin HEAD:refs/heads/chore/incremental-audit-20260918
          git rev-parse HEAD
