[package]
name = "kuma"
version = "0.16.81"
description = "kuma - KURO + mame integrated primer design & NGS verification app"
edition = "2021"
license = "GPL-2.0-or-later"
publish = false

[lib]
name = "kuma_lib"
crate-type = ["lib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "5"
tokio = { version = "1", features = ["sync", "rt", "macros", "io-util", "time", "fs"] }
keepawake = "0.6"
sha2 = "0.10"
trash = "5"
# Project folder <-> zip so a project can be carried to another machine.
# Already present transitively; pinned here as a direct dependency.
zip = { version = "4", default-features = false, features = ["deflate"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"

# Same version tauri uses, so `WebviewWindow::hwnd()` hands back this crate's HWND.
# Sets the window ICON_BIG that tauri leaves empty (src/icon_refresh.rs).
[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
# Same matcher tauri-plugin-fs uses for its scope patterns, so tests/fs_scope_test.rs
# judges capabilities/default.json by the rule that actually runs.
glob = "0.3"

[[test]]
name = "native_sidecar"
path = "tests/native_sidecar/main.rs"
harness = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
